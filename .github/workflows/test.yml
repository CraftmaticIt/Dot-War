name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .tools
          key: godot-${{ hashFiles('scripts/install_godot.sh') }}
      - run: ./scripts/install_godot.sh
      - run: ./scripts/test.sh
