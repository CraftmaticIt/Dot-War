name: android
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot/export_templates
          key: godot-android-${{ hashFiles('scripts/install_godot.sh', 'scripts/export_android.sh') }}
      - run: ./scripts/install_godot.sh
      - name: Sim benchmark (headless)
        run: .tools/godot --headless --path . res://game/benchmark.tscn -- --sim-only
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_PROJECT_REF != ''
        with:
          version: latest
      - name: Backend config for the client (public URL + anon key)
        if: env.SUPABASE_PROJECT_REF != ''
        run: |
          KEY="$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '[.[] | select(.name == "anon")][0].api_key')"
          jq -n --arg url "https://$SUPABASE_PROJECT_REF.supabase.co" --arg key "$KEY" '{url: $url, anon_key: $key}' > net/config.json
          echo "net/config.json written for $SUPABASE_PROJECT_REF"
      - run: ./scripts/export_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dot-war-debug-apk
          path: build/dot-war-debug.apk
