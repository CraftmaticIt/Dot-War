name: android
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/cache@v4
        with:
          path: |
            .tools
            ~/.local/share/godot/export_templates
          key: godot-android-${{ hashFiles('scripts/install_godot.sh', 'scripts/export_android.sh') }}
      - run: ./scripts/install_godot.sh
      - name: Sim benchmark (headless)
        run: .tools/godot --headless --path . res://game/benchmark.tscn -- --sim-only
      # Online builds only from main: the account-wide management token never reaches other branches.
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_PROJECT_REF != '' && env.ON_MAIN == 'true'
        with:
          version: 3.0.0
      - name: Backend config for the client (public URL + anon key)
        if: env.SUPABASE_PROJECT_REF != '' && env.ON_MAIN == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          KEY="$(supabase projects api-keys --remote="$SUPABASE_PROJECT_REF" --reveal -o json | jq -r 'first(.. | objects | select(.name? == "anon") | .api_key)')"
          test -n "$KEY" && test "$KEY" != "null"
          jq -n --arg url "https://$SUPABASE_PROJECT_REF.supabase.co" --arg key "$KEY" '{url: $url, anon_key: $key}' > net/config.json
          echo "net/config.json written for $SUPABASE_PROJECT_REF"
      - run: ./scripts/export_android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dot-war-debug-apk
          path: build/dot-war-debug.apk
          retention-days: 14  # ~28 MB per push; only recent builds are useful
