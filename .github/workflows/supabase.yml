name: supabase
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: supabase-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Supabase not configured (missing repository secrets) - skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: "22"
      - name: Server tests
        if: steps.cfg.outputs.ok == 'true'
        run: npm test
        working-directory: server
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ok == 'true'
        with:
          version: 3.0.0
      - name: Link project
        if: steps.cfg.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrate database
        if: steps.cfg.outputs.ok == 'true'
        run: supabase db push --remote -p "$SUPABASE_DB_PASSWORD" --yes
      - name: Push auth config
        if: steps.cfg.outputs.ok == 'true'
        run: supabase config push --yes
      - name: Deploy functions
        if: steps.cfg.outputs.ok == 'true'
        run: |
          ./scripts/prepare_functions.sh
          supabase functions deploy --use-api --yes
      - name: Smoke test
        if: steps.cfg.outputs.ok == 'true'
        run: |
          export SUPABASE_URL="https://$SUPABASE_PROJECT_REF.supabase.co"
          export SUPABASE_ANON_KEY="$(supabase projects api-keys --reveal -o json | jq -r 'first(.. | objects | select(.name? == "anon") | .api_key)')"
          test -n "$SUPABASE_ANON_KEY" && test "$SUPABASE_ANON_KEY" != "null" || { echo "anon key not found"; supabase projects api-keys -o json | jq 'map(.name)'; exit 1; }
          node --experimental-strip-types --no-warnings scripts/smoke_backend.ts
